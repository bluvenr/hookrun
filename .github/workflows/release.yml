name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
            pkg: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            pkg: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ''
            pkg: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            pkg: tar.gz
          - goos: windows
            goarch: amd64
            ext: '.exe'
            pkg: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set version variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BINARY="hookrun-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          LDFLAGS="-X github.com/bluvenr/hookrun/internal/version.Version=${{ steps.vars.outputs.version }} -X 'github.com/bluvenr/hookrun/internal/version.BuildTime=${{ steps.vars.outputs.build_time }}' -s -w"
          go build -ldflags "$LDFLAGS" -trimpath -o "dist/${BINARY}" ./cmd/hookrun

      - name: Package (tar.gz)
        if: matrix.pkg == 'tar.gz'
        run: |
          PKG="hookrun-v${{ steps.vars.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          tar -czf "dist/${PKG}.tar.gz" -C dist "hookrun-${{ matrix.goos }}-${{ matrix.goarch }}"
          rm "dist/hookrun-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Package (zip)
        if: matrix.pkg == 'zip'
        run: |
          PKG="hookrun-v${{ steps.vars.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          zip "${PKG}.zip" "hookrun-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          rm "hookrun-${{ matrix.goos }}-${{ matrix.goarch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hookrun-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate changelog from commits
        run: |
          set -euo pipefail
          CUR_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CUR_TAG}^" 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+${PREV_TAG}..}${CUR_TAG}"
          NOTES_FILE="NOTES.md"
          : > "$NOTES_FILE"

          emit_section() {
            local title="$1"
            local regex="$2"
            local invert="${3:-}"
            local lines
            if [ "$invert" = "-v" ]; then
              lines=$(git log "$RANGE" --pretty=format:'%s (%h)' | LC_ALL=C grep -vE "$regex" || true)
            else
              lines=$(git log "$RANGE" --pretty=format:'%s (%h)' | LC_ALL=C grep -E "$regex" || true)
            fi
            [ -z "$lines" ] && return
            {
              echo "## $title"
              echo ""
              while IFS= read -r line; do
                echo "* $line"
              done <<< "$lines"
              echo ""
            } >> "$NOTES_FILE"
          }

          emit_section "🚀 New Features"  '^(feat|feature)(\(.+\))?!?:'
          emit_section "🐛 Bug Fixes"     '^fix(\(.+\))?!?:'
          emit_section "📝 Documentation" '^docs(\(.+\))?!?:'
          emit_section "🔧 Maintenance"   '^chore(\(.+\))?!?:'
          emit_section "🏗️ CI/CD"         '^ci(\(.+\))?!?:'
          emit_section "🔨 Other Changes" '^(feat|feature|fix|docs|chore|ci)(\(.+\))?!?:' -v

          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CUR_TAG}" >> "$NOTES_FILE"
          else
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${CUR_TAG}" >> "$NOTES_FILE"
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: HookRun ${{ github.ref_name }}
          body_path: NOTES.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
